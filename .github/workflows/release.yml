# Pushing a tag vX.Y.Z builds nvModern X.Y.Z with `make release` (Tools/release.sh):
# Developer ID signing from a temporary keychain, notarized and stapled app and DMG,
# the signed Sparkle appcast and SHA-256 checksums. It then creates a DRAFT GitHub
# release with all of it. Publishing the draft (by hand, after a look) is what ships
# it: the app's update feed is releases/latest/download/appcast.xml, and drafts are
# never "latest". See docs/releasing.md.
#
# Secrets (Tools/setup-release-secrets.sh sets them):
#   DEVELOPER_ID_P12          base64 of the "Developer ID Application" certificate and key (.p12)
#   DEVELOPER_ID_P12_PASSWORD the .p12's password
#   NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD   Apple ID, team, app-specific password
#   SPARKLE_PRIVATE_KEY       nvModern's EdDSA update key, matching Tools/release.env
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the draft release

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag, the update key and the secrets
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="${TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$ ]] \
            || { echo "::error::tag $TAG is not like v2.1.0"; exit 1; }
          [ -f Tools/release.env ] && . Tools/release.env
          [ -n "${SPARKLE_PUBLIC_KEY:-}" ] \
            || { echo "::error::no SPARKLE_PUBLIC_KEY in Tools/release.env (run Tools/setup-release-secrets.sh and commit it)"; exit 1; }
          for s in P12 P12_PASSWORD NOTARY_APPLE_ID NOTARY_TEAM_ID NOTARY_PASSWORD SPARKLE_PRIVATE_KEY; do
            [ -n "${!s}" ] || { echo "::error::secret for $s is not set (Tools/setup-release-secrets.sh)"; exit 1; }
          done
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          xcodebuild -version; swift --version

      - uses: oven-sh/setup-bun@v2

      - name: Toolchain
        run: |
          brew install xcodegen
          xcodegen --version; bun --version

      - name: Signing keychain
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/release.keychain-db"
          KC_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KC_PASSWORD" "$KC"
          security set-keychain-settings -lut 5400 "$KC"
          security unlock-keychain -p "$KC_PASSWORD" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASSWORD" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KC" | sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' | head -1)"
          [ -n "$IDENTITY" ] || { echo "::error::no Developer ID Application identity in the .p12"; exit 1; }
          xcrun notarytool store-credentials nvmodern-notary --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" --keychain "$KC"
          {
            echo "DEVELOPER_ID=$IDENTITY"
            echo "NOTARY_PROFILE=nvmodern-notary"
            echo "NOTARY_KEYCHAIN=$KC"
          } >> "$GITHUB_ENV"

      - name: Build, sign, notarize, appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GITHUB_REPO: ${{ github.repository }}
        # Logs outside the checkout: Tools/release.sh refuses a dirty working tree.
        run: make release LOG_DIR="$RUNNER_TEMP/release-logs"

      - name: Release notes
        run: |
          {
            echo "**Install:** download \`nvModern-$VERSION.dmg\`, open it and drag nvModern to Applications. Signed and notarized."
            echo "Already have nvModern? It updates itself (or: nvModern › Check for Updates…)."
            echo
            echo '**SHA-256**'
            echo '```'
            cat "dist/release/upload/nvModern-$VERSION.sha256"
            echo '```'
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          U=dist/release/upload
          gh release create "$TAG" --draft --verify-tag --title "nvModern $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes \
            "$U/nvModern-$VERSION.dmg" "$U/nvModern.dmg" "$U/nvModern-$VERSION.sha256" "$U/appcast.xml"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: ${{ runner.temp }}/release-logs/
          if-no-files-found: ignore

      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
